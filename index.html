<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aruba Lift Tracker</title>
<style>
:root{--bg:#0d0f14;--card:#171a21;--line:#232733;--tx:#f2f4f8;--mut:#8a91a3;--ac:#4169e1;--ac2:#7b9bff;--warn:#ffb020;--bad:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
html,body,button,input,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
header b{letter-spacing:.12em;font-size:13px}.big{font-size:22px;font-weight:800;color:var(--ac2)}
#rt{font-variant-numeric:tabular-nums;color:var(--warn);font-weight:700;min-width:64px;text-align:right}
main{padding:12px 14px;max-width:560px;margin:auto}
.card{background:var(--card);border:0;border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip,.sm,.wt,.pri{border:0;background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;white-space:nowrap}
.chip.on,.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.pri{width:100%;padding:14px;font-size:16px;margin-top:8px}
.wt{color:var(--ac2);font-weight:700}
.sr{display:grid;grid-template-columns:26px 1fr 14px 1fr 44px;gap:6px;align-items:center;margin:6px 0}
.sr.v{grid-template-columns:26px 1fr}
.sr input{width:100%;min-width:0;background:#222632;color:var(--tx);border:0;border-radius:10px;padding:12px 0;text-align:center;font-size:18px}
.sr.dr input{outline:2px solid var(--warn);outline-offset:-2px}
.sr.hd{font-size:10px;color:var(--mut);text-align:center;margin:8px 0 0;letter-spacing:.08em}
.sn,.x{color:var(--mut);text-align:center;font-size:13px}
.dp{min-height:46px;border:0;background:var(--card);color:var(--warn);border-radius:10px;font-size:18px}.dp.on{background:var(--warn);color:#1a1000}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.dy{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:0;color:var(--mut);border-radius:10px;padding:8px 0;font-size:10px}.dy b{font-size:13px;color:var(--tx)}.dy.td{outline:2px solid var(--ac);outline-offset:-2px}.dy.on{background:var(--ac);color:#fff;border-color:var(--ac)}.dy.on b{color:#fff}
input[type=checkbox]{accent-color:var(--ac)}
.pl{padding:8px 0;border-bottom:1px solid var(--line)}
input,button{font-family:inherit}
label{font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}td:first-child,th:first-child{text-align:left}
tr.now td{color:var(--ac2);font-weight:700}
.up{color:var(--ac2)}.dn{color:var(--bad)}
nav{display:flex;gap:4px;margin-top:8px}nav button{flex:1;background:var(--card);border:0;color:var(--mut);border-radius:10px;padding:9px 0;font-size:13px}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
#t{position:fixed;left:14px;right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;padding:12px;border-radius:12px;font-weight:600;display:none;z-index:9}
.f{display:flex;gap:8px;margin:8px 0}.f input,textarea{flex:1;min-width:0;background:#222632;color:var(--tx);border:0;border-radius:10px;padding:10px;font-size:16px}
textarea{width:100%;height:170px;font-size:16px}
svg{width:100%;height:auto;display:block}
</style></head><body>
<header><div class="row"><div><b>ARUBA LIFT</b><div class="mut" id="cd"></div></div><div id="rt"></div></div><nav id="nv"></nav></header>
<main id="v"></main><div id="t"></div>
<script>
const KEY='aruba_lift_v1';
const X=[
['dbinc','DB Incline Bench Press',45,4,8,10,'add',5,0],
['mcp','Machine Chest Press',40,3,10,12,'add',5,0],
['pec','Pec Deck',90,3,10,12,'add',5,1],
['msp','Machine Shoulder Press',50,3,8,10,'add',5,0],
['lat','DB Lateral Raises',20,4,12,15,'add',5,0],
['tri','Tricep Pushdown',47.5,3,12,12,'add',2.5,0],
['cru','Weight Crunches',30,3,15,15,'add',5,0],
['apu','Assisted Pull-Ups',135,4,10,10,'drop',5,0],
['lpd','Lat Pull Down',120,3,12,12,'add',5,0],
['csr','Chest Supported Row',120,3,12,12,'add',5,0],
['tbr','T-Bar Row',40,3,10,10,'add',5,1],
['mcu','Machine Curl',80,3,12,12,'add',5,0],
['bcu','Bicep Curl',20,3,10,10,'add',2.5,0],
['sq','Barbell Squats',135,4,10,10,'add',10,1],
['rdl','RDLs',135,3,10,10,'add',10,0],
['ham','Hamstring Curls',175,3,12,12,'add',5,0],
['leg','Leg Extensions',130,3,12,12,'add',5,0],
['hlr','Hanging Leg Raises',0,3,15,15,'var',0,0],
['gob','Goblet Lunge Squats (heels on plate)',50,3,10,10,'add',5,0],
['rlu','Reverse Lunges',25,3,10,10,'add',5,0],
['drd','DB RDLs',45,3,10,10,'add',5,0],
['ply','Plyometric Split Squats',10,2,15,15,'add',5,0],
['hip','Hip Flexor Raises (each leg)',5,2,10,10,'add',2.5,0]];
const WK={'Push':['dbinc','mcp','pec','msp','lat','tri','cru'],
'Pull':['apu','lpd','csr','tbr','mcu','bcu','cru'],
'Upper':['dbinc','apu','msp','lat','csr','mcu','tri','cru'],
'Lower 1':['sq','rdl','ham','leg','hlr'],
'Lower 2':['gob','rlu','drd','ply','hip']};
const SUB={'Lower 1':'Heavy','Lower 2':'Athletic'};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const D=s=>new Date(s+'T12:00:00');
const days=(a,b)=>Math.round((D(b)-D(a))/864e5);
const addD=(s,n)=>fmt(new Date(D(s).getTime()+n*864e5));
const sh=s=>D(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const r1=n=>Math.round(n*10)/10;
function def(){const ex={};X.forEach(a=>ex[a[0]]={n:a[1],w:a[2],s:a[3],lo:a[4],hi:a[5],r:a[6],inc:a[7],c:a[8]?(a[0]=='sq'?'FULL ROM':'CLEAN'):'',st:a[2],v:'Knees up'});
return{ex,log:[],bw:[{d:'2026-11-08',w:263}],set:{sd:'2026-11-08',sw:263,gw:220,gd:'2027-02-19'},dr:{}}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.ex)S=def();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function suggest(){const m={1:'Push',2:'Pull',3:'Lower 1',5:'Upper',6:'Lower 2'},k=Object.keys(WK);
const g=new Date().getDay();if(m[g])return m[g];
const l=S.log.length?S.log[S.log.length-1].k:null;return k[(k.indexOf(l)+1)%k.length]}
let tab='train',cur=suggest(),rt=null,wv='d';
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)}
function rest(s){clearInterval(rt);let t=s;const e=$('#rt');const f=()=>{e.textContent=t>=0?Math.floor(t/60)+':'+pad(t%60):'';if(t--<-3){clearInterval(rt);e.textContent=''}};f();rt=setInterval(f,1000)}
const wtTxt=e=>e.r=='var'?e.v:e.w+' lb';
const rr=e=>e.lo==e.hi?e.hi:e.lo+'-'+e.hi;
function fe(id,x){const v=S.ex[id].r=='var';if(!x.sets)return(v?'':x.w+'×')+x.r.join('/');
const q=x.sets;if(q.every(t=>t.w==q[0].w&&!t.dr))return(v?'':q[0].w+'×')+q.map(t=>t.r).join('/');
return q.map(t=>(v?'':t.w+'×')+t.r+(t.dr?' ↓'+t.dw+'×'+t.dr:'')).join(', ')}
function lastOf(id){for(let i=S.log.length-1;i>=0;i--){const x=S.log[i].ex[id];if(x)return fe(id,x)}return''}
function gd(id){const d=S.dr[id]||(S.dr[id]={sets:[],c:0});if(!d.sets){d.sets=(d.r||[]).map(r=>({r}));delete d.r}return d}
function ss_(id,i,k,v){const d=gd(id);(d.sets[i]=d.sets[i]||{})[k]=v===''?null:+v;save()}
function tg(id,i){const d=gd(id),t=(d.sets[i]=d.sets[i]||{});t.o=!t.o;if(!t.o){t.dw=null;t.dr=null}save();go()}
function sc(id,v){gd(id).c=v?1:0;save()}
function hit(id){const d=gd(id);for(let i=0;i<S.ex[id].s;i++)(d.sets[i]=d.sets[i]||{}).r=S.ex[id].hi;save();go()}
function ew(id){const e=S.ex[id];if(e.r=='var'){e.v=e.v=='Knees up'?'Straight leg':'Knees up';save();go();return}
const w=prompt(e.n+' weight (lb)',e.w);if(w===null||isNaN(parseFloat(w)))return;e.w=parseFloat(w);
const i=prompt('Increment when target hit (lb)',e.inc);if(i!==null&&!isNaN(parseFloat(i)))e.inc=parseFloat(i);save();go()}
function fin(){const ex={},msg=[];
for(const id of WK[cur]){const d=gd(id),e=S.ex[id],v=e.r=='var';
if(!d.sets.some(t=>t&&(t.r||t.dr)))continue;
const q=Array.from({length:e.s},(_,i)=>{const t=d.sets[i]||{},o={w:v?0:(t.w!=null?t.w:e.w),r:t.r||0};if(t.o&&t.dr){o.dw=t.dw||0;o.dr=t.dr}return o});
ex[id]={w:e.w,r:q.map(t=>t.r),sets:q,c:d.c?1:0};
const ok=q.every(t=>t.r>=e.hi&&(v||(e.r=='drop'?t.w<=e.w:t.w>=e.w)))&&(!e.c||d.c);
if(ok){if(e.r=='add'){e.w=r1(Math.min(...q.map(t=>t.w))+e.inc);msg.push(e.n+' to '+e.w+' lb')}
else if(e.r=='drop'){e.w=Math.max(0,r1(Math.max(...q.map(t=>t.w))-e.inc));msg.push(e.n+' assist to '+e.w+' lb')}
else{e.v='Straight leg';msg.push(e.n+' to straight leg')}}}
if(!Object.keys(ex).length){toast('Log at least one set first');return}
S.log.push({d:today(),k:cur,ex});S.dr={};save();window.scrollTo(0,0);
toast(msg.length?'Target hit: '+msg.join(', '):'Saved. No targets hit yet, same weights next time');go()}
function vTrain(){
let h='<div class="chips">'+Object.keys(WK).map(k=>`<button class="chip ${k==cur?'on':''}" onclick="cur='${k}';go()">${k}${SUB[k]?' ('+SUB[k]+')':''}</button>`).join('')+'</div>';
h+='<div class="row" style="margin-top:8px"><span class="mut">Rest timer</span><span><button class="sm" onclick="rest(60)">1:00</button> <button class="sm" onclick="rest(90)">1:30</button> <button class="sm" onclick="rest(120)">2:00</button></span></div>';
h+='<div class="mut" style="margin-top:6px">Enter lb and reps per set. Blank lb uses the working weight. Tap ↓ to add a drop set.</div>';
h+=WK[cur].map(id=>{const e=S.ex[id],d=gd(id),l=lastOf(id),v=e.r=='var',c=v?'sr v':'sr';
let rows=`<div class="${c} hd"><span></span>${v?'':'<span>LB</span><span></span>'}<span>REPS</span>${v?'':'<span>DROP</span>'}</div>`;
for(let i=0;i<e.s;i++){const t=d.sets[i]||{};
rows+=`<div class="${c}"><span class="sn">${i+1}</span>${v?'':`<input type="number" inputmode="decimal" placeholder="${e.w}" value="${t.w!=null?t.w:''}" oninput="ss_('${id}',${i},'w',this.value)"><span class="x">×</span>`}<input type="number" inputmode="numeric" placeholder="${e.hi}" value="${t.r!=null?t.r:''}" oninput="ss_('${id}',${i},'r',this.value)">${v?'':`<button class="dp ${t.o?'on':''}" onclick="tg('${id}',${i})">${t.o?'✕':'↓'}</button>`}</div>`;
if(t.o&&!v)rows+=`<div class="sr dr"><span class="sn">↳</span><input type="number" inputmode="decimal" placeholder="drop lb" value="${t.dw!=null?t.dw:''}" oninput="ss_('${id}',${i},'dw',this.value)"><span class="x">×</span><input type="number" inputmode="numeric" placeholder="reps" value="${t.dr!=null?t.dr:''}" oninput="ss_('${id}',${i},'dr',this.value)"><span></span></div>`}
return `<div class="card"><div class="row"><b>${e.n}</b><button class="wt" onclick="ew('${id}')">${wtTxt(e)}</button></div>
<div class="mut">${e.s}×${rr(e)}${e.r=='drop'?' · lower assist when hit':''}${l?' · last '+l:''}</div>${rows}
<div class="row" style="margin-top:8px">${e.c?`<label><input type="checkbox" ${d.c?'checked':''} onchange="sc('${id}',this.checked)"> ${e.c}</label>`:'<span></span>'}<button class="sm" onclick="hit('${id}')">All sets hit</button></div></div>`}).join('');
return h+'<button class="pri" onclick="fin()">Finish workout</button>'}
function goal(d){const s=S.set,t=days(s.sd,s.gd)||1;return s.sw-(s.sw-s.gw)*Math.min(1,Math.max(0,days(s.sd,d)/t))}
function chart(){const s=S.set,t=days(s.sd,s.gd)||1,W=340,H=180,L=34,R=8,T=8,B=20;
const all=S.bw.map(b=>b.w).concat([s.sw,s.gw]),mn=Math.floor(Math.min(...all)-3),mx=Math.ceil(Math.max(...all)+3);
const x=d=>L+(W-L-R)*Math.max(0,Math.min(1.05,days(s.sd,d)/t)),y=w=>T+(H-T-B)*(1-(w-mn)/(mx-mn));
let o=`<svg viewBox="0 0 ${W} ${H}">`;
for(let i=0;i<=3;i++){const w=mn+(mx-mn)*i/3;o+=`<line x1="${L}" x2="${W-R}" y1="${y(w)}" y2="${y(w)}" stroke="#262b38"/><text x="${L-4}" y="${y(w)+4}" fill="#8a91a3" font-size="10" text-anchor="end">${Math.round(w)}</text>`}
o+=`<line x1="${x(s.sd)}" y1="${y(s.sw)}" x2="${x(s.gd)}" y2="${y(s.gw)}" stroke="#ffb020" stroke-dasharray="5 4" stroke-width="2"/>`;
if(S.bw.length>1)o+=`<polyline fill="none" stroke="#4169e1" stroke-width="2.5" points="${S.bw.map(b=>x(b.d)+','+y(b.w)).join(' ')}"/>`;
o+=S.bw.map(b=>`<circle cx="${x(b.d)}" cy="${y(b.w)}" r="3.5" fill="#4169e1"/>`).join('');
o+=`<text x="${L}" y="${H-4}" fill="#8a91a3" font-size="10">${sh(s.sd)}</text><text x="${W-R}" y="${H-4}" fill="#8a91a3" font-size="10" text-anchor="end">${sh(s.gd)}</text></svg>`;return o}
function addBW(){const d=$('#bd').value,w=parseFloat($('#bw').value);if(!d||!w)return;
S.bw=S.bw.filter(b=>b.d!=d).concat([{d,w}]).sort((a,b)=>a.d<b.d?-1:1);save();toast('Check-in saved: '+w+' lb');go()}
function delBW(d){S.bw=S.bw.filter(b=>b.d!=d);save();go()}
function setS(k,v){S.set[k]=(k=='sd'||k=='gd')?v:parseFloat(v);save();go()}
function dayTbl(){const s=S.set;let o='<div style="max-height:340px;overflow:auto"><table><tr><th>Date</th><th>Goal</th><th>Actual</th><th>Diff</th></tr>';
const end=days(s.sd,today())<0?s.sd:(days(today(),s.gd)<0?s.gd:today());
for(let d=end;days(s.sd,d)>=0;d=addD(d,-1)){const a=S.bw.find(b=>b.d==d),gg=r1(goal(d)),df=a?r1(a.w-gg):0;
o+=`<tr class="${d==today()?'now':''}"><td>${sh(d)}</td><td>${gg}</td><td>${a?a.w:'<span class="mut">·</span>'}</td><td class="${a?(df<=0?'up':'dn'):''}">${a?(df>0?'+':'')+df:''}</td></tr>`}
return o}
function vW(){const s=S.set,td=today(),last=S.bw[S.bw.length-1],g=goal(td);
const te=S.bw.find(b=>b.d==td),w7=S.bw.filter(b=>b.d>=addD(td,-6)&&b.d<=td),av=w7.length?r1(w7.reduce((a,b)=>a+b.w,0)/w7.length):null;let st=0,sx=te?td:addD(td,-1);while(S.bw.some(b=>b.d==sx)){st++;sx=addD(sx,-1)}
const diff=last?r1(last.w-g):0;
let h=`<div class="card"><div class="row"><div><div class="mut">Latest</div><div class="big">${last?last.w:'-'} lb</div></div>
<div style="text-align:right"><div class="mut">Goal today</div><div class="big" style="color:var(--warn)">${r1(g)} lb</div></div></div>
<div class="mut" style="margin-top:6px">${last?(diff<=0?'<span class="up">'+Math.abs(diff)+' lb ahead of pace</span>':'<span class="dn">'+diff+' lb behind pace</span>')+' · ':''}${last?r1(s.sw-last.w):0} lb lost · ${r1(last?last.w-s.gw:0)} to go</div></div>
<div class="card"><div class="row"><b>Daily check-in</b><span class="${te?'up':'dn'}">${te?'Logged today: '+te.w+' lb':'Not logged today'}</span></div><div class="mut">${av?'7-day avg '+av+' lb · ':''}${st} day streak</div><div class="f"><input type="date" id="bd" value="${td}"><input type="number" id="bw" inputmode="decimal" placeholder="lb" value="${te?te.w:''}"></div><button class="pri" style="margin-top:0" onclick="addBW()">Save check-in</button></div>
<div class="card">${chart()}<div class="mut">Green: your check-ins. Orange dashed: goal line (about ${r1((s.sw-s.gw)/(days(s.sd,s.gd)||1))} lb a day).</div></div>
<div class="card"><div class="row"><b>Goal log</b><span><button class="chip ${wv=='d'?'on':''}" onclick="wv='d';go()">Daily</button> <button class="chip ${wv=='w'?'on':''}" onclick="wv='w';go()">Weekly</button></span></div>${wv=='d'?dayTbl():'<table><tr><th>Wk</th><th>Date</th><th>Goal</th><th>Actual</th><th>Diff</th></tr>'}`;
const n=Math.ceil(days(s.sd,s.gd)/7);
for(let i=0;wv=='w'&&i<=n;i++){let ds=addD(s.sd,7*i);if(days(ds,s.gd)<0)ds=s.gd;const nx=addD(ds,7);
const a=S.bw.filter(b=>b.d>=ds&&b.d<nx).slice(-1)[0],gg=r1(goal(ds)),now=td>=ds&&td<nx;
h+=`<tr class="${now?'now':''}"><td>${i}</td><td>${sh(ds)}</td><td>${gg}</td><td>${a?a.w:''}</td><td class="${a?(a.w<=gg?'up':'dn'):''}">${a?(r1(a.w-gg)>0?'+':'')+r1(a.w-gg):''}</td></tr>`}
h+=`</table>${wv=='d'?'</div>':''}</div><div class="card"><b>Entries</b>${S.bw.slice().reverse().map(b=>`<div class="row mut" style="padding:4px 0"><span>${sh(b.d)} · ${b.w} lb</span><button class="sm" onclick="delBW('${b.d}')">Delete</button></div>`).join('')}</div>
<details class="card"><summary>Goal settings</summary>
<div class="f"><span class="mut" style="flex:1">Start date</span><input type="date" value="${s.sd}" onchange="setS('sd',this.value)"></div>
<div class="f"><span class="mut" style="flex:1">Start weight</span><input type="number" value="${s.sw}" onchange="setS('sw',this.value)"></div>
<div class="f"><span class="mut" style="flex:1">Goal weight</span><input type="number" value="${s.gw}" onchange="setS('gw',this.value)"></div>
<div class="f"><span class="mut" style="flex:1">Goal date</span><input type="date" value="${s.gd}" onchange="setS('gd',this.value)"></div></details>`;return h}
function vL(){let h='<div class="mut">Tap a weight to edit it or its increment. Hit the top of the rep range on every set to move up.</div>';
h+=X.map(a=>{const e=S.ex[a[0]],d=r1(e.w-e.st);return `<div class="card row"><div><b>${e.n}</b><div class="mut">${e.s}×${e.lo==e.hi?e.hi:e.lo+'-'+e.hi}${e.c?' · '+e.c:''}${e.r!='var'?' · +'+e.inc+' lb steps':''}</div></div>
<div style="text-align:right"><button class="wt" onclick="ew('${a[0]}')">${wtTxt(e)}</button>${e.r!='var'&&d?`<div class="mut ${(e.r=='drop'?d<0:d>0)?'up':''}">${d>0?'+':''}${d} since start</div>`:''}</div></div>`}).join('');
h+=`<div class="card"><b>Export</b><div class="mut">Note copies your weight log and current lifts as plain text for the Notes app. Backup copies everything so you can restore it with Import.</div><textarea id="dt" placeholder="Your export shows up here. Paste a backup here to import."></textarea>
<div class="f"><button class="sm" style="flex:1" onclick="ex_('n')">Export note</button><button class="sm" style="flex:1" onclick="ex_('j')">Backup</button><button class="sm" style="flex:1" onclick="im_()">Import</button></div></div>`;return h}
function note(){const td=today(),last=S.bw[S.bw.length-1],o=['ARUBA LIFT '+sh(td)];
if(last)o.push('','WEIGHT','Now: '+last.w+' lb ('+sh(last.d)+')','Goal today: '+r1(goal(td))+' lb','Goal: '+S.set.gw+' lb by '+sh(S.set.gd));
o.push('','WEIGHT LOG');S.bw.forEach(b=>o.push(sh(b.d)+': '+b.w+' lb'));
o.push('','LIFTS (current weights)');
Object.keys(WK).forEach(k=>{o.push('',k.toUpperCase()+(SUB[k]?' ('+SUB[k]+')':''));WK[k].forEach(id=>{const e=S.ex[id];o.push('- '+e.n+': '+wtTxt(e)+', '+e.s+'x'+(e.lo==e.hi?e.hi:e.lo+'-'+e.hi))})});
return o.join('\n')}
function ex_(k){const t=$('#dt');t.value=k=='j'?JSON.stringify(S):note();t.select();const ok=()=>toast(k=='j'?'Backup copied. Paste it somewhere safe.':'Copied. Paste it into Notes.'),no=()=>toast('Select all in the box and copy it');try{navigator.clipboard.writeText(t.value).then(ok,no)}catch(e){no()}}
function im_(){try{const o=JSON.parse($('#dt').value);if(!o.ex||!o.log)throw 0;S=o;save();toast('Imported');go()}catch(e){toast('That does not look like a backup')}}
let dc=-1;
function delWk(i){if(dc===i){S.log.splice(i,1);dc=-1;save();go()}else{dc=i;go();setTimeout(()=>{if(dc===i){dc=-1;go()}},4000)}}
function vH(){if(!S.log.length)return '<div class="card mut">No workouts logged yet.</div>';
return S.log.map((l,i)=>[l,i]).reverse().map(([l,i])=>`<div class="card"><div class="row"><b>${l.k}</b><span><span class="mut">${sh(l.d)}</span> <button class="sm" style="${dc==i?'background:var(--bad);color:#fff':'color:var(--bad)'}" onclick="delWk(${i})">${dc==i?'Tap again to delete':'Delete'}</button></span></div>${Object.keys(l.ex).map(id=>`<div class="mut">${S.ex[id].n}: ${fe(id,l.ex[id])}</div>`).join('')}</div>`).join('')}

const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],SCHED=[null,'Push','Pull','Lower 1',null,'Upper','Lower 2'],ORD=[1,2,3,4,5,6,0];
let pd=(new Date().getDay()+6)%7;
function vP(){const td=new Date().getDay();
let h='<div class="wk">'+ORD.map((n,i)=>`<button class="dy ${i==pd?'on':''} ${n==td?'td':''}" onclick="pd=${i};go()"><b>${DN[n]}</b><span>${SCHED[n]||'Rest'}</span></button>`).join('')+'</div>';
const n=ORD[pd],k=SCHED[n];
if(!k)return h+`<div class="card"><b>${DF[n]}: Rest</b><div class="mut">No lifting today.</div></div>`;
return h+`<div class="card"><div class="row"><b>${DF[n]}: ${k}${SUB[k]?' ('+SUB[k]+')':''}</b><span class="mut">${WK[k].length} exercises</span></div>`+WK[k].map((id,i)=>{const e=S.ex[id];return `<div class="row pl"><div><span class="mut">${i+1}.</span> ${e.n}${e.c?' <span class="mut">· '+e.c+'</span>':''}</div><div style="text-align:right"><div>${e.s}×${rr(e)}</div><div class="mut">${wtTxt(e)}</div></div></div>`}).join('')+`<button class="pri" onclick="cur='${k}';go('train')">Start ${k}</button></div>`}
function go(t){if(t){tab=t;window.scrollTo(0,0)}const c=days(today(),S.set.gd);
$('#cd').textContent=c>0?c+' days to Aruba · Feb 19':'Aruba time';
$('#nv').innerHTML=[['train','Train'],['plan','Plan'],['w','Weight'],['l','Lifts'],['h','History']].map(a=>`<button class="${tab==a[0]?'on':''}" onclick="go('${a[0]}')">${a[1]}</button>`).join('');
$('#v').innerHTML={train:vTrain,plan:vP,w:vW,l:vL,h:vH}[tab]()}
go();
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<350&&!e.target.closest('input,textarea,button,label,summary'))e.preventDefault();lt=n},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
</script></body></html>
